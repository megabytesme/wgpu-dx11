[package]
name = "wgpu-dx11-surface-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
raw-window-handle = "0.6.2"
naga = { path = "../../naga", features = ["wgsl-in"] }
wgpu-hal = { path = "../../wgpu-hal", default-features = false, features = ["dx11"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[profile.release]
panic = "abort"
